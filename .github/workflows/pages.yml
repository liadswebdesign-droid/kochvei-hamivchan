name: Build and deploy to GitHub Pages

# Push to main (or a manual run): strict build. It FAILS while content/build/ is incomplete or public/content holds
# dev fixtures, so fixtures can never reach the girls' tablets. Previews (`npm run build:preview`) stay local: a
# deploy here replaces the one site the tablets run.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the build job (which runs npm code) can only read; only the deploy job can publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: app
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment); bump them deliberately.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build (strict)
        run: npm run build
        env:
          # Public URL of the usage-stats Worker (stats/), from the repo variable STATS_URL. Not a secret. Unset or
          # empty = usage pings off in this build.
          VITE_STATS_URL: ${{ vars.STATS_URL }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
