name: Build and deploy to GitHub Pages

# Push to main: strict build. It FAILS while content/build/ is incomplete, so dev fixtures can never ship by accident.
# Manual run with preview=true: explicit preview build (fixtures / unvocalized drafts, with an on-screen
# "preview" banner) for testing on the tablets before the nikud pipeline has produced content/build/.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview build: allow dev fixtures / unvocalized drafts (shows a preview banner)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build (strict)
        if: ${{ !inputs.preview }}
        run: npm run build
      - name: Build (preview, fixtures allowed)
        if: ${{ inputs.preview }}
        run: npm run build:preview
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
